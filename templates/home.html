<!-- templates/home.html -->
{% extends 'base.html' %}

{% block title %}Home — RentEase{% endblock %}

{% block content %}
<div class="text-center py-5">
  <i class="fa-solid fa-house-chimney fa-4x text-primary mb-3"></i>
  <h1 class="fw-bold">Welcome to RentEase</h1>
  <p class="text-muted">Find and book your perfect rental home.</p>
  <a href="{% url 'register' %}" class="btn btn-primary btn-lg me-2">
    <i class="fa-solid fa-user-plus me-2"></i>Get Started
  </a>
  <a href="{% url 'house_list' %}" class="btn btn-outline-primary btn-lg">
    <i class="fa-solid fa-magnifying-glass me-2"></i>Browse Houses
  </a>
</div>
{% endblock %}
