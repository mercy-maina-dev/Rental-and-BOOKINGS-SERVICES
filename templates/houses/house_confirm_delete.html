{% extends 'base.html' %}
{% block title %}Delete Listing — RentEase{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card p-4 p-md-5 text-center">
      <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex align-items-center
                  justify-content-center mx-auto mb-3" style="width:72px;height:72px;">
        <i class="fa-solid fa-trash fa-2x text-danger"></i>
      </div>
      <h4 class="fw-bold mb-2">Delete Listing?</h4>
      <p class="text-muted mb-4">
        You are about to permanently delete
        <strong>"{{ house.title }}"</strong>.
        This cannot be undone.
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger flex-grow-1 py-2 fw-semibold">
            <i class="fa-solid fa-trash me-2"></i>Yes, Delete
          </button>
          <a href="{% url 'landlord_dashboard' %}" class="btn btn-outline-secondary flex-grow-1">
            <i class="fa-solid fa-xmark me-1"></i>Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
